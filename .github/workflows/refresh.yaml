name: Refresh IPO data

# Scrapes ipowatch.in and commits an updated data.json. Netlify redeploys on push.
on:
  schedule:
    - cron: '0 * * * *'        # top of every hour (UTC); GitHub may delay a few min
  workflow_dispatch: {}         # allow manual "Run workflow" from the Actions tab
  push:
    branches: [main]
    paths: ['scripts/scrape.js']  # re-run when the scraper changes

permissions:
  contents: write               # needed to commit data.json back to the repo

concurrency:
  group: refresh-ipo-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Zero dependencies — just run the scraper.
      - name: Scrape latest IPO data
        run: node scripts/scrape.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore: refresh IPO data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
